<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salon Equipment Empire Ltd | Salon and barbershop equipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--k:#000;--k2:#111412;--k3:#1c201d;--w:#fff;--g:#2fd10e;--gd:#0e3b17;--mute:#6b726d;--line:#e4e7e4;--r:14px;
--d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--b:'Figtree','Segoe UI',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--w);color:var(--k);font:400 16px/1.6 var(--b);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--k);z-index:30}
img{max-width:100%;display:block}a{color:inherit}
h1,h2,h3{font-family:var(--d);margin:0;line-height:1.08;letter-spacing:-.02em}
:focus-visible{outline:3px solid var(--g);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--k);color:var(--w)}
header .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font:700 1.02rem/1.1 var(--d)}
.brand img{width:40px;height:40px;object-fit:contain}
nav{margin-left:auto;display:flex;align-items:center;gap:22px;font-weight:500;font-size:.95rem}
nav a{text-decoration:none;color:#cfd5d0}nav a:hover{color:var(--w)}
.quote{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--g);color:var(--k);font:800 .92rem/1 var(--d);letter-spacing:.09em;padding:14px 20px;border-radius:999px;text-decoration:none;border:2px solid var(--g);transition:background .15s,color .15s;min-height:46px;white-space:nowrap}
.quote:hover{background:var(--k);color:var(--g)}
.quote svg{width:19px;height:19px;flex:none}
.quote.lg{font-size:1.05rem;padding:18px 28px;min-height:56px}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:2px solid currentColor;border-radius:999px;padding:12px 20px;min-height:46px;font:600 .95rem/1 var(--b);text-decoration:none;background:none;color:inherit;cursor:pointer}
.ghost:hover{background:var(--k);color:var(--w);border-color:var(--k)}
.dark .ghost:hover{background:var(--w);color:var(--k);border-color:var(--w)}
.hero{background:var(--k);color:var(--w);padding:56px 0 72px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.5rem);font-weight:700}
.hero p{color:#c4cbc6;font-size:1.12rem;max-width:34em;margin:22px 0 30px}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.hbox{position:relative;background:var(--w);border-radius:22px;padding:18px;aspect-ratio:4/5;display:flex}
.hbox img{width:100%;height:100%;object-fit:contain}
.hbox .quote{position:absolute;right:-10px;bottom:26px;transform:rotate(-4deg);box-shadow:0 8px 0 var(--gd)}
section{padding:68px 0}
.sh{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px}
.sh h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:700}
.sh p{margin:6px 0 0;color:var(--mute);max-width:36em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--k);background:none;border-radius:999px;padding:9px 16px;font:600 .9rem var(--b);cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--k);color:var(--w)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--w)}
.ph{display:block;aspect-ratio:4/5;background:var(--w);padding:10px}
.ph img{width:100%;height:100%;object-fit:contain}
.cb{padding:16px 18px 20px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);flex:1}
.cat{font-size:.82rem;color:var(--mute)}
.cb h3{font-size:1.2rem}.cb h3 a{text-decoration:none}.cb h3 a:hover{text-decoration:underline}
.cb .quote{margin-top:auto;align-self:flex-start}
.dark{background:var(--k);color:var(--w)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;border-top:3px solid var(--g);padding-top:16px}
.steps li::before{content:counter(s);font:700 2.4rem/1 var(--d);color:var(--g);display:block;margin-bottom:10px}
.steps h3{font-size:1.25rem;margin-bottom:6px}.steps p{margin:0;color:#c4cbc6}
.bulk{background:var(--gd);color:var(--w);border-radius:22px;padding:36px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.bulk h2{font-size:clamp(1.5rem,3vw,2.1rem)}.bulk p{margin:8px 0 0;color:#cfe3d3;max-width:32em}
footer{background:var(--k);color:#c4cbc6;padding:48px 0 96px}
footer .wrap{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:center}
footer img{width:190px}footer a{color:var(--w)}
.crumb{font-size:.9rem;color:var(--mute);margin-bottom:18px}.crumb a{text-decoration:none}
.pd{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:start}
.main{background:var(--w);border:1px solid var(--line);border-radius:var(--r);aspect-ratio:4/5;padding:12px}
.main img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.thumbs button{width:72px;height:72px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:4px;cursor:pointer}
.thumbs button[aria-current=true]{border-color:var(--k)}.thumbs img{width:100%;height:100%;object-fit:contain}
.pd h1{font-size:clamp(2rem,4vw,3rem);font-weight:700;margin:6px 0 16px}
.pd .desc{color:#333;font-size:1.08rem;max-width:34em}
.pd .acts{margin:24px 0 8px}
.note{font-size:.92rem;color:var(--mute)}
.sticky{display:none}
.float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:60px;height:60px;border-radius:50%;background:var(--g);color:var(--k);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35);border:3px solid var(--k)}
.float svg{width:32px;height:32px}
.empty{padding:40px;border:2px dashed var(--line);border-radius:var(--r);color:var(--mute)}
.adm{max-width:860px}
.arow{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.arow img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px}
.arow b{flex:1}.arow button,.btn{font:600 .9rem var(--b);border:1.5px solid var(--k);background:var(--w);border-radius:999px;padding:9px 16px;cursor:pointer;min-height:40px}
.btn.p{background:var(--k);color:var(--w)}.btn.x{border-color:#b42318;color:#b42318}
.form{display:grid;gap:14px;margin:20px 0}
.form label{display:grid;gap:5px;font-weight:600;font-size:.92rem}
.form input[type=text],.form textarea{font:400 1rem var(--b);padding:11px 12px;border:1.5px solid #b9bfba;border-radius:10px;width:100%}
.form textarea{min-height:110px}
.imgs{display:flex;gap:10px;flex-wrap:wrap}.imgs div{position:relative}
.imgs img{width:84px;height:84px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.imgs button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:#b42318;color:#fff;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--k);color:var(--w);padding:12px 18px;border-radius:12px;z-index:40;max-width:90vw}
@media(max-width:860px){
 nav a.hide{display:none}nav{gap:12px}
 .hero{padding:36px 0 56px}.hero .wrap,.pd{grid-template-columns:1fr;gap:30px}
 .hbox .quote{right:6px}.steps{grid-template-columns:1fr}
 section{padding:48px 0}
 .pm .sticky{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--k);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:10px}
 .pm .sticky .quote{flex:1}.pm .float{display:none}
 .brand span{max-width:9.5em}
}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:12px}.cb{padding:12px}.cb h3{font-size:1rem}.quote{padding:12px 14px;font-size:.8rem;letter-spacing:.05em}.quote svg{display:none}.nav-q{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

.cartbtn{background:var(--g);color:#000;border:0;border-radius:999px;padding:10px 16px;font:700 .9rem var(--d);cursor:pointer;min-height:42px;display:inline-flex;gap:8px;align-items:center}
.cartbtn b{background:#000;color:var(--g);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}.about h2{font-size:clamp(1.8rem,3.6vw,2.6rem);margin-bottom:14px}.about p{max-width:36em;color:#333}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;display:flex;gap:12px;align-items:center;font-weight:600;line-height:1.25}.tile img{width:56px;height:56px;object-fit:contain;flex:none}.tile small{display:block;font-weight:400;color:var(--mute)}
.srch{width:100%;max-width:380px;font:400 1rem var(--b);padding:12px 16px;border:1.5px solid var(--k);border-radius:999px}
.ph{position:relative}.badge{position:absolute;top:10px;left:10px;background:var(--k);color:var(--g);font:700 .75rem var(--d);padding:5px 10px;border-radius:99px}
.ca{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.ca .quote{margin:0}.ghost.sm{padding:10px 14px;min-height:46px;font-size:.88rem}
.faq details{border-bottom:1px solid #333;padding:16px 0}.faq summary{cursor:pointer;font:600 1.1rem var(--d)}.faq p{margin:10px 0 0;color:#c4cbc6;max-width:40em}
.back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45}body.co .back{display:block}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:50;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}body.co #cart{transform:none}
#cart .ch{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}#cart h2{font-size:1.4rem}
#cart .ci{flex:1;overflow:auto;padding:14px 18px}#cart .cf{padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}#cart .cf .quote{width:100%}
.qty{display:flex;align-items:center;gap:8px;font-weight:600}.qty button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--k);background:#fff;cursor:pointer;font-size:1.1rem}
@media(max-width:860px){.about{grid-template-columns:1fr}}
@media(max-width:420px){.tiles{grid-template-columns:1fr}}

.hero{position:relative;overflow:hidden;padding:64px 0 80px}
.hero .wm{position:absolute;right:-120px;top:-60px;width:620px;opacity:.07;pointer-events:none}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(2.6rem,6.4vw,5rem);letter-spacing:-.03em}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:30px;color:#c4cbc6;font-size:.95rem}.facts span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--g);margin-right:9px}
.collage{position:relative;aspect-ratio:1/1.02}
.cl{position:absolute;background:#fff;border-radius:18px;padding:10px;aspect-ratio:4/5;box-shadow:0 18px 40px rgba(0,0,0,.45);display:block}
.cl img{width:100%;height:100%;object-fit:contain}
.cl1{left:0;top:8%;width:50%;rotate:-5deg}.cl2{right:0;top:0;width:46%;rotate:4deg}.cl3{left:24%;bottom:0;width:50%;rotate:-1.5deg}
.collage .quote{position:absolute;right:2%;bottom:14%;rotate:-6deg;box-shadow:0 8px 0 var(--gd);z-index:2}
.strip{background:var(--g);color:#000;overflow:hidden;padding:16px 0;white-space:nowrap}
.strip div{display:inline-block;animation:mq 38s linear infinite;font:700 1.15rem var(--d)}
.strip span{margin:0 26px}.strip span::after{content:"/";margin-left:52px;opacity:.5}
@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.strip div{animation:none}}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.ct{position:relative;border-radius:var(--r);background:#f3f5f3;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:12px;min-height:250px;border:1px solid var(--line)}
.ct .im{flex:1;display:grid;place-items:center;min-height:150px}.ct img{max-height:170px;object-fit:contain;width:100%}
.ct b{font:700 1.1rem var(--d)}.ct small{display:block;color:var(--mute);font-weight:500}
.ct.soon{background:#fff;border-style:dashed}.ct.soon .im{font:800 2.4rem var(--d);color:#c9cfca}
.grey{background:#f3f5f3}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px}.why h3{font-size:1.3rem;margin-bottom:8px;color:var(--g)}.why p{margin:0;color:#c4cbc6}
.light .steps li{border-top-color:var(--gd)}.light .steps li::before{color:var(--gd)}.light .steps p{color:#444}
footer{border-top:1px solid #222}
.shophead{background:var(--k);color:#fff;padding:40px 0 34px}.shophead h1{font-size:clamp(2.2rem,5vw,3.4rem)}.shophead p{color:#c4cbc6;margin:8px 0 20px;max-width:38em}
.shophead .srch{border-color:var(--g);background:#fff}
.shop{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}.side h2{font-size:1.1rem;margin-bottom:10px}.side ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.side li button{width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font:500 .98rem var(--b);cursor:pointer;display:flex;justify-content:space-between;min-height:42px}
.side li button[aria-pressed=true]{background:var(--k);color:#fff}.side li button small{opacity:.65}
.side .help{margin-top:22px;padding:16px;border-radius:var(--r);background:#f3f5f3;font-size:.92rem}.side .help .quote{margin-top:10px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.bar select{font:500 .95rem var(--b);padding:9px 12px;border-radius:10px;border:1.5px solid var(--k);background:#fff}
.card.ask{border-style:dashed;justify-content:center}.card.ask .cb{border:0;justify-content:center}
@media(max-width:860px){.shop{grid-template-columns:1fr;gap:18px}.side{position:static}.side ul{display:flex;overflow-x:auto;gap:8px;padding-bottom:6px}.side li button{white-space:nowrap;border:1.5px solid var(--k);border-radius:999px;width:auto;gap:8px}.side .help{display:none}.hero{padding:40px 0 56px}.collage{max-width:420px;margin:0 auto;width:100%}.hero .wm{width:380px}}

.shoplink{color:#fff!important;font-weight:700;border:1.5px solid #444;border-radius:999px;padding:9px 16px;min-height:42px;display:inline-flex;align-items:center}
.side ul{-webkit-overflow-scrolling:touch}
@media(max-width:560px){
 .wrap{padding:0 16px}header .wrap{height:62px;gap:10px}nav{gap:8px}
 .brand{font-size:.88rem;gap:8px}.brand img{width:34px;height:34px}.brand span{max-width:7.5em}
 .shoplink{padding:8px 13px;font-size:.9rem}.cartbtn{padding:8px 12px}
 section{padding:40px 0}.hero{padding:30px 0 44px}
 .hero h1{font-size:2.35rem}.hero p{font-size:1.02rem;margin:16px 0 22px}
 .hero .acts>*{flex:1 1 100%}.facts{margin-top:22px;gap:8px 16px;font-size:.9rem}
 .quote{white-space:normal;text-align:center}.quote.lg{font-size:.95rem;padding:16px 18px;min-height:54px}
 .sh{margin-bottom:20px}.sh .ghost{width:100%}
 .grid{grid-template-columns:1fr 1fr;gap:12px}.cb{padding:12px}.cb h3{font-size:1rem}.cat{font-size:.74rem}
 .ca{flex-direction:column;align-items:stretch;gap:8px}.ca .quote,.ca .ghost{width:100%;padding:12px 8px;font-size:.78rem;letter-spacing:.05em}.ca .quote svg{display:none}.ghost.sm{font-size:.82rem}
 .ph{padding:6px}.badge{font-size:.68rem;padding:4px 8px;top:6px;left:6px}
 .cats{grid-template-columns:1fr 1fr;gap:12px}.ct{min-height:190px;padding:10px}.ct .im{min-height:110px}.ct img{max-height:120px}.ct b{font-size:.95rem}
 .why{gap:22px}.bulk{padding:24px 20px}.bulk .acts>*{flex:1 1 100%}
 .steps{gap:18px}.faq summary{font-size:1rem}
 .shophead{padding:28px 0 24px}.srch{max-width:none}
 .pd .acts>*{flex:1 1 100%}.pd h1{font-size:1.9rem}.thumbs button{width:64px;height:64px}
 .card.ask .cb{padding:16px 12px}
 footer .wrap{flex-direction:column;align-items:flex-start}footer img{width:150px}
 #cart .quote.lg{font-size:.9rem}.arow{flex-wrap:wrap}
}
@media(max-width:360px){.brand span{display:none}.grid{gap:8px}}
.nav-q{display:none!important}
</style>
</head>

function drawer(){const it=CART.map(c=>({c,p:S.products.find(p=>p.id===c.id)})).filter(x=>x.p);
const msg=`Hello Salon Equipment Empire Ltd. I'd like a quote for these items:\n${it.map((x,i)=>`${i+1}. ${x.p.name} (Code ${x.p.code}) x ${x.c.q}`).join('\n')}\n\nOrder code: ${OC}\nPlease send me the price, available options and delivery information. I will pay after your quote and send this order code with my payment.`;
return `<div class="back" data-cc="1"></div><aside id="cart" role="dialog" aria-label="Quote list"><div class="ch"><h2>Your quote list</h2><button class="btn" data-cc="1">Close</button></div>${it.length?`<div class="ci">${it.map(x=>`<div class="arow"><img src="${esc(x.p.imgs[0])}" alt=""><b>${esc(x.p.name)}<br><small style="font-weight:400;color:#6b726d">${esc(x.p.code)}</small></b><span class="qty"><button data-q="${x.p.id}|-1" aria-label="Fewer">−</button>${x.c.q}<button data-q="${x.p.id}|1" aria-label="More">+</button></span><button class="btn x" data-del="${x.p.id}" aria-label="Remove ${esc(x.p.name)}">×</button></div>`).join('')}</div><div class="cf"><p class="note">Your order code is <b>${OC}</b>. Keep it. You will send it with your payment after we quote.</p>${QB(wa(msg),'SEND LIST ON WHATSAPP','lg')}<button class="btn" data-clr="1" style="margin-top:10px">Clear list</button></div>`:`<div class="empty" style="margin:20px">Your list is empty. Tap Add to quote list on any product.</div>`}</aside>`}
function updCart(){const w=document.getElementById('cartwrap');if(w)w.innerHTML=drawer();document.querySelectorAll('.cc').forEach(e=>e.textContent=cartN())}
const filt=()=>{const q=Q.toLowerCase();return S.products.filter(p=>(!F||p.cat===F)&&(!q||(p.name+' '+p.code+' '+p.cat+' '+p.desc).toLowerCase().includes(q))).sort(SORT==='az'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>(b.featured?1:0)-(a.featured?1:0))};
const askCard=()=>`<article class="card ask"><div class="cb"><h3>Can’t see what you need?</h3><p class="note">More products are being added. Tell us what you are looking for and we will quote it.</p>${QB(wa("Hello Salon Equipment Empire Ltd. I’m looking for a product I couldn’t find on your website. Please help me with the available options and prices."),'ASK US')}</div></article>`;
function gridHTML(){return filt().map(card).join('')+askCard()}
function refresh(){document.getElementById('grid').innerHTML=gridHTML();const n=filt().length;document.getElementById('count').textContent=n+(n===1?' product':' products')+(F?' in '+F:'')}
const go=c=>{F=c;if(location.hash==='#shop'){app.innerHTML=shop();wire();updCart();window.scrollTo(0,0)}else location.hash='shop'};
document.addEventListener('click',e=>{const t=e.target.closest('[data-add],[data-co],[data-cc],[data-q],[data-del],[data-clr],[data-cat]');if(!t)return;const d=t.dataset;
 if(d.cat!==undefined){e.preventDefault();go(d.cat);return}
 if(d.add)addC(d.add);
 if(d.co)document.body.classList.add('co');
 if(d.cc!==undefined)document.body.classList.remove('co');
 if(d.q){const[i,n]=d.q.split('|'),c=CART.find(x=>x.id===i);if(c){c.q+=+n;if(c.q<1)CART=CART.filter(x=>x!==c);saveC();updCart()}}
 if(d.del){CART=CART.filter(x=>x.id!==d.del);saveC();updCart()}
 if(d.clr!==undefined){CART=[];OC=newOC();saveC();updCart()}});

const card=p=>`<article class="card"><a class="ph" href="#p-${p.id}" aria-label="${esc(p.name)}">${p.featured?'<span class="badge">Featured</span>':''}<img loading="lazy" src="${esc(p.imgs[0])}" alt="${esc(p.name)}"></a><div class="cb"><span class="cat">${esc(p.cat)} · ${esc(p.code)}</span><h3><a href="#p-${p.id}">${esc(p.name)}</a></h3><div class="ca">${PQ(p)}<button class="ghost sm" data-add="${p.id}">+ Add to list</button></div></div></article>`;
const head=()=>`<header><div class="wrap"><a class="brand" href="#top"><img src="${S.mark}" alt=""><span>Salon Equipment Empire</span></a><nav><a class="hide" href="#about">About</a><a class="hide" href="#how">How to order</a><a class="hide" href="#faq">FAQ</a><a class="shoplink" href="#shop">Shop</a><button class="cartbtn" data-co="1" aria-label="Open quote list">Quote<span class="lbl">&nbsp;list</span> <b class="cc">0</b></button></nav></div></header>`;
const foot=()=>`<footer class="dark"><div class="wrap"><img src="${S.logo}" alt="Salon Equipment Empire Limited"><div><p>WhatsApp: <a href="${wa(GEN)}" target="_blank" rel="noopener">+234 818 498 6674</a></p><p>Prices, availability, delivery and payment are agreed with our team on WhatsApp.</p>${OWNER?'<p><a href="#admin">Manage products</a></p>':''}</div></div></footer><div id="cartwrap"></div><a class="float" href="${wa(GEN)}" target="_blank" rel="noopener" aria-label="Chat with Salon Equipment Empire on WhatsApp">${IC}</a>`;
function home(){
 const pr=S.products,feat=pr.filter(p=>p.featured),top=(feat.length>2?feat:pr),ac=allCats();
 const steps=[["Find your products","Browse the shop or search by name or product code."],["Build your quote list","Tap Add to list on each item, or Ask Quote on a single product."],["Send it on WhatsApp","Your list goes with an order code that starts with SEE."],["Get your quote and pay","We reply with price, options and delivery. Our account details come with the quote."],["Send your order code","Send the order code and payment proof in the same chat. We confirm and arrange delivery."]];
 const faq=[["Why are there no prices on the website?","Prices depend on the model, quantity and delivery location, so our team quotes each order on WhatsApp."],["How do I pay?","After you accept the quote, we send our account details on WhatsApp. Pay, then send your order code and payment proof in the same chat."],["What is the order code?","It is created when you send your quote list and starts with SEE. It lets us match your payment to your order."],["Can I order many items or in bulk?","Yes. Add everything to your quote list and send it in one message."],["Can you tell me about delivery?","Tell us your location in the chat and we will include delivery in your quote."]];
 const mq=ac.map(c=>`<span>${esc(c)}</span>`).join('');
 return head()+`<main id="top"><div class="hero dark"><img class="wm" src="${S.mark}" alt=""><div class="wrap"><div><h1>Everything your salon or barbershop is built on.</h1><p>Pedicure spa chairs, barber chairs, styling chairs, clippers, combs, brushes and more, from one supplier. Pick what you need and we quote it on WhatsApp.</p><div class="acts"><a class="quote lg" href="#shop">SHOP NOW</a><a class="ghost" style="color:#fff" href="${wa(GEN)}" target="_blank" rel="noopener">Chat with us</a></div><div class="facts"><span>Real product photos</span><span>Quotes on WhatsApp</span><span>Bulk and full fit-outs</span></div></div><div class="collage">${top.slice(0,3).map((p,i)=>`<a class="cl cl${i+1}" href="#p-${p.id}" aria-label="${esc(p.name)}"><img src="${esc(p.imgs[0])}" alt="${esc(p.name)}"></a>`).join('')}<span class="quote" aria-hidden="true">ASK QUOTE</span></div></div></div>
 <div class="strip" aria-hidden="true"><div>${mq}${mq}${mq}${mq}</div></div>
 <section id="about"><div class="wrap"><div class="sh"><div><h2>Shop by category</h2><p>Salon Equipment Empire Ltd supplies equipment and tools to salons, spas and barbershops. Every product is photographed from our real stock.</p></div><a class="ghost" href="#shop">View all products</a></div><div class="cats">${ac.map(c=>{const p=pr.find(x=>x.cat===c);return p?`<a class="ct" href="#shop" data-cat="${esc(c)}"><span class="im"><img loading="lazy" src="${esc(p.imgs[0])}" alt=""></span><b>${esc(c)}<small>${pr.filter(x=>x.cat===c).length} in the shop</small></b></a>`:`<a class="ct soon" href="${wa("Hello Salon Equipment Empire Ltd. I’m looking for "+c+". Please send me the available options and prices.")}" target="_blank" rel="noopener"><span class="im">${esc(c.charAt(0))}</span><b>${esc(c)}<small>Arriving soon. Ask us now.</small></b></a>`}).join('')}</div></div></section>
 <section class="grey"><div class="wrap"><div class="sh"><div><h2>Featured</h2><p>Every item shows ASK QUOTE. Our team sends the price on WhatsApp.</p></div><a class="ghost" href="#shop">Go to the shop</a></div><div class="grid">${top.slice(0,4).map(card).join('')}</div></div></section>
 <section class="dark"><div class="wrap"><div class="sh"><h2>Why buy from us</h2></div><div class="why"><div><h3>What you see is what you get</h3><p>Photos are of the products we actually sell, not stock images.</p></div><div><h3>One supplier for the whole salon</h3><p>Chairs, tools and accessories in one order, one chat, one delivery plan.</p></div><div><h3>A real person on WhatsApp</h3><p>Ask about options, sizes and availability before you pay.</p></div><div><h3>Built for bulk</h3><p>Opening a new salon? Send the full list and get one combined quote.</p></div></div></div></section>
 <section id="how" class="light"><div class="wrap"><div class="sh"><h2>How to order</h2></div><ol class="steps" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${steps.map(s=>`<li><h3>${s[0]}</h3><p>${s[1]}</p></li>`).join('')}</ol><div class="acts" style="margin-top:34px"><a class="quote lg" href="#shop">SHOP NOW</a></div></div></section>
 <section style="padding-top:0"><div class="wrap"><div class="bulk"><div><h2>Clippers, combs, brushes and more are on the way</h2><p>We are adding new products all the time. Tell us what you need and we will quote it now.</p></div><div class="acts">${QB(wa(GEN),'ASK ON WHATSAPP')}<a class="ghost" style="color:#fff" href="${wa(MSG.bulk)}" target="_blank" rel="noopener">Bulk enquiry</a></div></div></div></section>
 <section id="faq" class="dark"><div class="wrap faq"><div class="sh"><h2>Common questions</h2></div>${faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div></section></main>`+foot();
}
function shop(){
 const cs=cats(),n=filt().length;
 return head()+`<main><div class="shophead"><div class="wrap"><h1>Shop</h1><p>Every product is priced on quote for now. Add items to your quote list, send it on WhatsApp, and we reply with prices and delivery.</p><input class="srch" id="srch" type="search" placeholder="Search by name or product code" value="${esc(Q)}" aria-label="Search products"></div></div>
 <section style="padding-top:34px"><div class="wrap shop"><aside class="side"><h2>Categories</h2><ul><li><button data-cat="" aria-pressed="${!F}">All products <small>${S.products.length}</small></button></li>${cs.map(c=>`<li><button data-cat="${esc(c)}" aria-pressed="${F===c}">${esc(c)} <small>${S.products.filter(p=>p.cat===c).length}</small></button></li>`).join('')}</ul><div class="help"><b>Looking for something else?</b><br>Clippers, combs, brushes and more are being added.${QB(wa(GEN),'ASK US')}</div></aside><div><div class="bar"><span id="count">${n} ${n===1?'product':'products'}${F?' in '+esc(F):''}</span><label>Sort <select id="sort"><option value="feat" ${SORT==='feat'?'selected':''}>Featured first</option><option value="az" ${SORT==='az'?'selected':''}>Name A to Z</option></select></label></div><div class="grid" id="grid">${gridHTML()}</div></div></div></section></main>`+foot();
}
function product(p){
 const rel=S.products.filter(x=>x.id!==p.id&&x.cat===p.cat).concat(S.products.filter(x=>x.id!==p.id&&x.cat!==p.cat)).slice(0,4);
 return head()+`<main class="pm"><section style="padding-top:28px"><div class="wrap"><div class="crumb"><a href="#top">Home</a> / <a href="#catalogue" data-cat="${esc(p.cat)}">${esc(p.cat)}</a> / ${esc(p.name)}</div><div class="pd"><div><div class="main"><img id="mainimg" src="${esc(p.imgs[0])}" alt="${esc(p.name)}"></div>${p.imgs.length>1?`<div class="thumbs">${p.imgs.map((u,i)=>`<button data-i="${i}" aria-label="Photo ${i+1}" aria-current="${i==0}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>`:''}</div><div><span class="cat">${esc(p.cat)}</span><h1>${esc(p.name)}</h1><p class="note" style="margin-top:-8px">Product code: ${esc(p.code)}</p><p class="desc">${esc(p.desc)}</p><div class="acts">${PQ(p,'lg')}<button class="ghost" data-add="${p.id}">Add to quote list</button></div><div class="acts" style="margin-top:12px"><a class="ghost" href="${wa(MSG.d(p.name))}" target="_blank" rel="noopener">Get product details</a><a class="ghost" href="${wa(MSG.o(p.name))}" target="_blank" rel="noopener">Order this product</a></div><p class="note">Price, availability and delivery are confirmed with our team on WhatsApp.</p></div></div></div></section>
 ${rel.length?`<section style="padding-top:0"><div class="wrap"><div class="sh"><h2>Related products</h2></div><div class="grid">${rel.map(card).join('')}</div></div></section>`:''}<div class="sticky">${PQ(p)}</div></main>`+foot();
}
function toast(m){clearTimeout(toastT);document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);toastT=setTimeout(()=>t.remove(),5000)}
function admin(){
 if(!OWNER)return head()+`<main><section><div class="wrap adm"><h1>Manage products</h1><p>Open this page while signed in as its owner to add, edit or remove products.</p><a class="btn" href="#top">Back to the website</a></div></section></main>`;
 if(draft)return head()+`<main><section><div class="wrap adm"><h1>${draft.isNew?'Add product':'Edit product'}</h1><div class="form"><label>Product name<input type="text" id="f-name" value="${esc(draft.name)}"></label><label>Product code<input type="text" id="f-code" value="${esc(draft.code||'')}" placeholder="Leave empty to create one"></label><label>Category<input type="text" id="f-cat" list="cl" value="${esc(draft.cat)}"><datalist id="cl">${allCats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label><label>Description<textarea id="f-desc">${esc(draft.desc)}</textarea></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-feat" ${draft.featured?'checked':''}> Feature on the homepage</label><div><b>Photos</b> (first photo is the main one)<div class="imgs" style="margin:10px 0">${draft.imgs.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button data-rm="${i}" aria-label="Remove photo">×</button></div>`).join('')}</div><input type="file" id="f-up" accept="image/*" multiple></div></div><div class="acts"><button class="btn p" id="save">Save and publish</button><button class="btn" id="cancel">Cancel</button></div></div></section></main>`;
 return head()+`<main><section><div class="wrap adm"><div class="sh"><h1>Manage products</h1><button class="btn p" id="add">Add product</button></div>${S.products.map(p=>`<div class="arow"><img src="${esc(p.imgs[0]||'')}" alt=""><b>${esc(p.name)}<br><small style="font-weight:400;color:#6b726d">${esc(p.cat)}${p.featured?' · Featured':''}</small></b><button data-e="${p.id}">Edit</button><button class="x btn" data-d="${p.id}">Remove</button></div>`).join('')||'<div class="empty">No products yet. Add your first one.</div>'}<p class="note">Changes go live for all visitors when you save.</p><a href="#top">Back to the website</a></div></section></main>`;
}
async function publish(){
 const a=await claude.use('artifact');if(!a){toast('Publishing is not available in this view.');return false}
 const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('.toast')?.remove();
 c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 try{await a.publish('<!doctype html>\n'+c.outerHTML);return true}catch(e){toast(e&&e.code==='conflict'?'Someone else just published. Reload and try again.':'Could not publish. Try again.');return false}
}
function shrink(f){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.86)};i.onerror=rej;i.src=URL.createObjectURL(f)})}
const slug=s=>(s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'product');
function wire(){
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>go(b.dataset.f));const sr=document.getElementById('srch');if(sr)sr.oninput=()=>{Q=sr.value;refresh()};const so=document.getElementById('sort');if(so)so.onchange=()=>{SORT=so.value;refresh()};
 app.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>{document.getElementById('mainimg').src=b.querySelector('img').src;app.querySelectorAll('.thumbs button').forEach(x=>x.setAttribute('aria-current',x===b))});
 const $=id=>document.getElementById(id),on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
 const sync=()=>{if(!draft)return;draft.name=$('f-name').value;draft.code=$('f-code').value.trim();draft.cat=$('f-cat').value;draft.desc=$('f-desc').value;draft.featured=$('f-feat').checked};
 on('add',()=>{draft={isNew:true,id:'',code:'',name:'',cat:cats()[0]||'',desc:'',featured:false,imgs:[]};render()});
 on('cancel',()=>{draft=null;render()});
 app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{draft=JSON.parse(JSON.stringify(S.products.find(p=>p.id===b.dataset.e)));render()});
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const p=S.products.find(p=>p.id===b.dataset.d);if(!confirm('Remove '+p.name+'?'))return;S.products=S.products.filter(x=>x!==p);await publish()});
 app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sync();draft.imgs.splice(+b.dataset.rm,1);render()});
 const up=$('f-up');if(up)up.onchange=async()=>{sync();const as=await claude.use('assets');if(!as){toast('Photo upload is not available.');return}toast('Uploading photos…');try{for(const f of up.files){const r=await as.upload(await shrink(f));draft.imgs.push(r.url)}}catch(e){toast('A photo could not be uploaded.')}render()};
 on('save',async()=>{sync();if(!draft.name.trim()||!draft.imgs.length){toast('Add a product name and at least one photo.');return}
  draft.name=draft.name.trim();draft.cat=draft.cat.trim()||'Other';if(!draft.code){let n=S.products.length+1,c;do{c='SEE-'+String(n++).padStart(3,'0')}while(S.products.some(p=>p.code===c));draft.code=c}
  if(draft.isNew){let id=slug(draft.name),n=2,b=id;while(S.products.some(p=>p.id===id))id=b+'-'+n++;draft.id=id;delete draft.isNew;S.products.push(draft)}
  else S.products=S.products.map(p=>p.id===draft.id?draft:p);
  $('save').disabled=true;if(!(await publish())){$('save').disabled=false}});
}
function render(){
 const h=location.hash.slice(1);document.body.classList.remove('pm');
 if(h==='admin'){app.innerHTML=admin()}
 else if(h.startsWith('p-')&&S.products.find(p=>'p-'+p.id===h)){app.innerHTML=product(S.products.find(p=>'p-'+p.id===h));document.title=S.products.find(p=>'p-'+p.id===h).name+' | Salon Equipment Empire Ltd'}
 else if(h==='shop'){app.innerHTML=shop();window.scrollTo(0,0);document.title='Shop | Salon Equipment Empire Ltd'}else{app.innerHTML=home();const e=h&&document.getElementById(h);if(e)e.scrollIntoView()}
 wire();updCart();
}
window.addEventListener('hashchange',()=>{draft=null;render();if(!location.hash.startsWith('#p-')&&location.hash!=='#admin')document.title='Salon Equipment Empire Ltd | Salon and barbershop equipment';if(location.hash.startsWith('#p-')||location.hash==='#admin')window.scrollTo(0,0)});
render();
(async()=>{try{const u=await claude.use('user');OWNER=!!(u&&u.isOwner())}catch(e){}if(OWNER&&!draft)render()})();
</script>
</body>
</html>
